name: branch
run-name: Publishing images for branch ${{ github.ref_name }}
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - "master"
    paths:
      - .github/workflows/branch.yml
      - backend/**
      - Dockerfile
      - entrypoint.sh

permissions:
  id-token: write
  contents: read
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Java
        uses: actions/setup-java@v6.2.0
        with:
          java-version: "25"
          distribution: "corretto"

      - name: Test and Build Artifact
        run: ./gradlew build

      - name: Read LittleHorse Version
        run: |
          LH_VERSION=$(./gradlew -q printLittleHorseVersion --console=plain)
          echo "LH_VERSION=$LH_VERSION" >> "$GITHUB_ENV"

      - name: Build and Publish Backend
        id: publish-image
        uses: littlehorse-enterprises/publish-image@v1.4.1
        with:
          image-name: lh-business-console-backend
          dockerfile: Dockerfile
          build-args: |
            LH_VERSION=${{ env.LH_VERSION }}
          registry: ecr
          prefix: branch-
