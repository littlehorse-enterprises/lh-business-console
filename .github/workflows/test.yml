name: test
run-name: Running Tests for branch ${{ github.head_ref }}
on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          java-version: '25'
          distribution: 'corretto'

      - name: Test and Build Artifact
        run: ./gradlew build
