plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'com.diffplug.spotless'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

dependencies {
    compileOnly 'org.projectlombok:lombok:1.18.40'
    annotationProcessor 'org.projectlombok:lombok:1.18.40'

    implementation 'com.c4-soft.springaddons:spring-addons-starter-oidc:9.7.0'

    implementation "io.littlehorse:littlehorse-client:${littlehorseVersion}"
    implementation 'commons-codec:commons-codec'
    // Token parsing still uses Jackson 2; Spring MVC uses Boot's default Jackson 3.
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation ('org.keycloak:keycloak-admin-client:26.0.8')

    constraints {
        implementation('jakarta.mail:jakarta.mail-api:2.1.5') {
            because 'CVE-2025-7962 fix - patching vulnerable transitive dependency'
        }
    }

    testImplementation 'com.c4-soft.springaddons:spring-addons-starter-oidc-test:9.1.5'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

bootJar {
    archiveFileName = "lh-user-tasks-bridge-backend.${archiveExtension.get()}"
}

spotless {
    java {
        target('**/*.java')
        palantirJavaFormat()
    }
}
